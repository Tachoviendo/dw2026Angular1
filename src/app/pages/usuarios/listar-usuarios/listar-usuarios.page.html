<button routerLink="/usuarios/create">Crear usuario</button>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Apellido</th>
      <th>Username</th>
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody>
    @for (usuario of usuarios; track usuario.id_usuario) {
      <tr>
        <td>{{ usuario.id_usuario }}</td>
        <td>{{ usuario.nombre }}</td>
        <td>{{ usuario.apellido }}</td>
        <td>{{ usuario.username }}</td>
        <td>
          <button>Editar</button>
          <button>Eliminar</button>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="5">No se encontraron usuarios registrados.</td>
      </tr>
    }
  </tbody>
</table>
